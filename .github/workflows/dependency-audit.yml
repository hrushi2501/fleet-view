name: Release quality

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Safe values that are valid enough to generate Prisma Client and exercise
    # deployment validation. They are not production credentials and cannot
    # connect to a real database.
    env:
      DATABASE_URL: postgresql://ci:ci-build-only-password@aws-0.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      AUTH_SECRET: ci-build-only-auth-secret-that-is-at-least-32-bytes
      CRON_SECRET: ci-build-only-cron-secret-that-is-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep CI on the exact major Vercel selects from package.json/.nvmrc.
          # A Node 20 audit cannot prove a Next 16/Prisma production build that
          # will run under Node 24.
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # One command developers can run before every change and CI enforces on
      # every PR/push: lint, types, all hermetic tests, deployment assertions,
      # and a production compilation.
      - run: npm run verify
      # CI has deliberately non-routable database credentials. It validates
      # the Vercel environment contract, while Vercel itself runs
      # `vercel-build` with its real, read-only runtime database connection.
      # Never run `db:check` here: a fake URL must not turn an offline quality
      # gate into a network-dependent failure.
      - run: npm run deploy:check
        env:
          VERCEL: "1"
          VERCEL_ENV: production
      - run: npm audit --omit=dev --audit-level=high
